# OpenAI / Codex agent metadata for yueyu-skill.
# Mirrors skill.json so an OpenAI/Codex consumer can discover the MCP endpoint,
# tool inventory, and version without opening skill.json.

version: 0.2.7
display_name: "月瑀科技营销服务查询"
short_description: "实时查询月瑀科技的小红书代运营、达人投放、信息流广告、线索转化和营销复盘服务（只读 MCP）。"
default_prompt: "Use $yueyu-skill to answer questions about 月瑀科技 / YUEYU TECH: company info, service lines, methodology, AI tools, latest reports, and contact details. This skill is read-only. For partnership or lead intent, call get_contact_info and direct the user to https://www.yueyu.tech/ or the published phone/email; do not call submit_lead, subscribe_reports, or unsubscribe_reports."

mcp:
  transport: streamable-http
  url: https://www.yueyu.tech/mcp
  protocol_version: "2025-03-26"

policy:
  allow_implicit_invocation: true

# Tool inventory (6 read-only). Names and schemas are checked against the live
# server by scripts/check_mcp_drift.py. Legacy write tools stay closed.
tools:
  - name: get_company_info
    type: query
    description: 公司基本信息（名称、简介、公开事实源、办公地址和联系方式）。无参数。
  - name: get_service_lines
    type: query
    description: 核心服务板块（账号营销、小红书达人投放、信息流广告、线索转化、营销复盘）。无参数。
  - name: get_methodology
    type: query
    description: 3Insights、4I Wheels、5D Model 等品牌营销方法论。无参数。
  - name: get_products
    type: query
    description: BrandLens、MuseWrite、REDFabric 等相关工具与资料。无参数，访问地址以官网为准。
  - name: get_latest_reports
    type: query
    description: 最新行业报告与学习资料。参数：limit（默认5，最大20）、since（YYYY-MM-DD 增量）、offset（翻页）、type（report/learning）。
  - name: get_contact_info
    type: query
    description: 商务联系方式（电话、邮箱、微信说明、地址、工作时间）。无参数。

guardrails:
  no_fabrication: 回答具体服务、案例、报价、合同、效果承诺前必须先调用对应工具；没有公开核验的信息就说明不知道。
  readonly_only: 不得调用已关闭的 submit_lead / subscribe_reports / unsubscribe_reports；合作/留资/订阅意图一律引导官网顾问入口或公开联系方式。
  fallback: MCP 超时（>5s）时可用 SKILL.md 静态数据降级回复；仍不得编造未核验事实。
