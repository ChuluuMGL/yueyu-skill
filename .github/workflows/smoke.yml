name: CI

# smoke job 手动运行完整 MCP 冒烟测试；每日线上巡检由 MCP Drift Check 负责，避免重复定时打接口。
# manifest job 静态校验 skill 清单（版本号一致 + 工具字段齐全），push / PR 时跑。
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - skill.json
      - SKILL.md
      - README.md
      - README.en.md
      - CHANGELOG.md
      - agents/openai.yaml
      - assets/**
      - references/**
      - scripts/mcp_smoke_test.sh
      - scripts/check_manifest.sh
      - scripts/check_mcp_drift.py
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/smoke.yml
      - .github/workflows/mcp-drift-check.yml
  pull_request:
    paths:
      - skill.json
      - SKILL.md
      - README.md
      - README.en.md
      - CHANGELOG.md
      - agents/openai.yaml
      - assets/**
      - references/**
      - scripts/mcp_smoke_test.sh
      - scripts/check_manifest.sh
      - scripts/check_mcp_drift.py
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/smoke.yml
      - .github/workflows/mcp-drift-check.yml

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run MCP smoke test
        run: bash scripts/mcp_smoke_test.sh

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check skill manifest (versions + schema)
        run: bash scripts/check_manifest.sh
